name: Ticket watcher (Paris - Hammer)

# Each run watches for ~5.5 hours, then starts the next run itself, so watching
# is continuous. The schedule below is only a safety net.
# To stop everything: Actions -> Ticket watcher -> "..." -> Disable workflow.
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

concurrency:
  group: nutcracker-watcher
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Watch for tickets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_SEATS: ${{ vars.TARGET_SEATS }}
          ONLY_DATES: ${{ vars.ONLY_DATES }}
          LONDON_ENABLED: "0"   # Nutcracker: tickets bought
          SWAN_ENABLED: "0"     # Swan Lake: tickets bought
          SWAN_CAST: ${{ vars.SWAN_CAST }}
          SWAN_TARGET_SEATS: ${{ vars.SWAN_TARGET_SEATS }}
          SWAN_ONLY_DATES: ${{ vars.SWAN_ONLY_DATES }}
          PARIS_ENABLED: ${{ vars.PARIS_ENABLED }}
          PARIS_TARGET_SEATS: ${{ vars.PARIS_TARGET_SEATS }}
          PARIS_ONLY_DATES: ${{ vars.PARIS_ONLY_DATES }}
          CHECK_EVERY_MINUTES: "3"
          RUN_FOR_MINUTES: "330"
        run: python monitor.py

      - name: Save what the bot has seen
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "nutcracker-watcher"
          git config user.email "nutcracker-watcher@users.noreply.github.com"
          keep="$RUNNER_TEMP/keep"; mkdir -p "$keep"
          cp state.json "$keep/"
          [ -d snapshots ] && cp -r snapshots "$keep/"
          for attempt in 1 2 3; do
            # Start from the latest version on GitHub, then put this run's state on top
            git fetch -q origin "${{ github.ref_name }}"
            git reset -q --hard "origin/${{ github.ref_name }}"
            cp "$keep/state.json" state.json
            [ -d "$keep/snapshots" ] && mkdir -p snapshots && cp -rn "$keep/snapshots/." snapshots/ || true
            git add state.json
            [ -d snapshots ] && git add snapshots
            git diff --cached --quiet && exit 0
            git commit -q -m "Update watcher state"
            git push -q origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep 10
          done
          echo "Could not save state" && exit 1

      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}"

      - name: Keep page snapshots for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          retention-days: 5
          if-no-files-found: ignore
